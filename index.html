<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإجازات والاجتماعات - دار للسلام والازدهار</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root { --primary: #3C6255; --secondary: #9CAF88; --accent: #FFD700; --dark: #2A4A3D; --success: #28a745; --danger: #dc3545; --info: #17a2b8; }
        body { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%); color: white; padding: 25px 0; text-align: center; border-radius: 15px 15px 0 0; }
        .logo { background: white; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
        .logo i { color: var(--primary); font-size: 36px; }
        .tabs { display: flex; background: white; border-radius: 0 0 15px 15px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 18px; font-size: 18px; font-weight: 600; border: none; background: #f8f9fa; color: #666; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .tab-btn.active { background: white; color: var(--primary); border-bottom: 3px solid var(--primary); }
        .tab-btn.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .tab-content { display: none; background: white; border-radius: 0 0 15px 15px; padding: 30px; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .security-section { background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%); padding: 25px; border-radius: 15px; margin-bottom: 25px; color: white; text-align: center; }
        .security-input-group { display: flex; gap: 10px; max-width: 400px; margin: 0 auto; }
        .security-input-group input { flex: 1; padding: 12px; border: none; border-radius: 8px; text-align: center; font-family: monospace; }
        .security-btn { background: var(--accent); color: var(--dark); border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        
        /* بطاقة الرصيد */
        .balance-section { background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%); padding: 20px; border-radius: 15px; margin-bottom: 25px; color: white; display: none; }
        .balance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 15px; }
        .balance-item { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; text-align: center; }
        .balance-item .value { font-size: 24px; font-weight: bold; }
        .balance-loading { text-align: center; padding: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--dark); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; }
        .submit-btn { background: linear-gradient(135deg, var(--info) 0%, #0d6efd 100%); color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .readonly-field { background-color: #f0f0f0 !important; cursor: not-allowed; }
        .alert { padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; display: none; }
        .alert-success { background: #d4edda; color: var(--success); }
        .alert-danger { background: #f8d7da; color: var(--danger); }
        .loader { text-align: center; margin: 20px 0; display: none; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--secondary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer { text-align: center; padding: 30px 0; color: #666; font-size: 14px; border-top: 1px solid #eee; margin-top: 30px; }
        .meeting-form-card { background: #f8f9fa; padding: 25px; border-radius: 15px; margin-bottom: 20px; }
        .meetings-list { margin-top: 20px; max-height: 350px; overflow-y: auto; }
        .meeting-item { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 3px solid var(--info); }
        @media (max-width: 768px) { .security-input-group { flex-direction: column; } .balance-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header"><div class="logo"><i class="fas fa-hands-helping"></i></div><h1>دار للسلام والازدهار</h1><p>Dar for Peace and Prosperity</p></header>
        
        <div class="tabs">
            <button class="tab-btn active" id="leaveTabBtn" onclick="switchTab('leave')"><i class="fas fa-calendar-alt"></i> طلبات الإجازة</button>
            <button class="tab-btn disabled" id="meetingTabBtn" onclick="switchTab('meeting')"><i class="fas fa-video"></i> حجز الاجتماعات 🔒</button>
        </div>

        <!-- تبويب الإجازات -->
        <div id="leaveTab" class="tab-content active">
            <div class="security-section">
                <h3><i class="fas fa-shield-alt"></i> رمز الأمان</h3>
                <div class="security-input-group">
                    <input type="password" id="securityCode" placeholder="أدخل الرمز السري" onkeypress="handleEnterKey(event)">
                    <button class="security-btn" onclick="verifySecurityCode()"><i class="fas fa-lock-open"></i> دخول</button>
                </div>
                <div id="securityError" style="color: #ff6b6b; margin-top: 10px; display: none;">رمز خاطئ!</div>
            </div>

            <!-- ✅ بطاقة الرصيد -->
            <div id="balanceSection" class="balance-section">
                <h3><i class="fas fa-chart-pie"></i> رصيد الإجازات المتبقي</h3>
                <div id="balanceLoading" class="balance-loading">جاري التحميل...</div>
                <div id="balanceGrid" class="balance-grid"></div>
            </div>

            <form id="leaveForm">
                <div class="form-group"><label>القسم</label><input type="text" id="dept" class="readonly-field" readonly></div>
                <div class="form-group"><label>اسم الموظف</label><input type="text" id="empName" class="readonly-field" readonly></div>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="empEmail" class="readonly-field" readonly></div>
                <div class="form-group"><label>نوع الإجازة</label><select id="leaveType" disabled><option value="">اختر نوع الإجازة</option><option value="annual">إجازة سنوية</option><option value="sick">إجازة مرضية</option><option value="hourly">إجازة ساعية</option><option value="hajj">إجازة حج</option><option value="marriage">إجازة زواج</option></select></div>
                <div class="form-group"><label>تاريخ البدء</label><input type="date" id="startDate" disabled></div>
                <div class="form-group"><label>تاريخ الانتهاء</label><input type="date" id="endDate" disabled></div>
                <div class="form-group"><label>تاريخ الالتحاق</label><input type="date" id="returnDate" disabled></div>
                <div class="form-group"><label>السبب</label><textarea id="reason" rows="3" disabled></textarea></div>
                <div class="loader" id="leaveLoader"><div class="spinner"></div></div>
                <button type="submit" class="submit-btn" id="submitLeaveBtn" disabled>إرسال الطلب</button>
                <div id="leaveSuccess" class="alert alert-success"></div>
            </form>
        </div>

        <!-- تبويب الاجتماعات -->
        <div id="meetingTab" class="tab-content">
            <div class="meeting-form-card">
                <h3><i class="fas fa-calendar-plus"></i> حجز اجتماع جديد</h3>
                <form id="meetingForm">
                    <div class="form-group"><label>عنوان الاجتماع</label><input type="text" id="meetingTitle" required></div>
                    <div class="form-group"><label>مع من</label><select id="meetingAttendee"><option value="">اختر الشخص</option></select></div>
                    <div class="form-group"><label>التاريخ</label><input type="date" id="meetingDate" required></div>
                    <div class="form-group"><label>الوقت</label><select id="meetingTime"><option value="10:00">10:00 صباحاً</option><option value="11:00">11:00 صباحاً</option><option value="12:00">12:00 ظهراً</option></select></div>
                    <div class="form-group"><label>رابط Google Meet</label><input type="url" id="meetingLocation" required placeholder="https://meet.google.com/xxx-yyyy-zzz"></div>
                    <button type="submit" class="submit-btn">حجز الاجتماع</button>
                    <div id="meetingSuccess" class="alert alert-success"></div>
                    <div id="meetingError" class="alert alert-danger"></div>
                    <div class="loader" id="meetingLoader"><div class="spinner"></div></div>
                </form>
            </div>
            <div id="meetingsList" class="meetings-list"><p style="color:#999; text-align:center;">لا توجد اجتماعات</p></div>
        </div>
        
        <footer class="footer"><p>© 2026 دار للسلام والازدهار</p></footer>
    </div>

    <script>
        // ============= الرابط =============
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzpgH-eHxTdcTTK8qi3NtkGC6woI3N-1YJ7DGGoBxu4QJi10popZ-0OQVE6L1oq9Uzw/exec';

        // ============= بيانات الموظفين =============
        const employees = {
            "مهيدي الخالدي": { email: "malkhaldi@dar.ngo", dept: "المراقبة والتقييم", code: "ME_001" },
            "نانسي حلاق": { email: "nhallak@dar.ngo", dept: "المراقبة والتقييم", code: "ME_222" },
            "سلاف أبو حمدان": { email: "shamdan@dar.ngo", dept: "البرامج", code: "Pro_202" },
            "رغد العبو": { email: "ralabo@dar.ngo", dept: "البرامج", code: "Pro_020" },
            "سيلفارت سلوم": { email: "ssalloum@dar.ngo", dept: "البرامج", code: "Pro_S26" },
            "محمد الهادي": { email: "malhadi@dar.ngo", dept: "البرامج", code: "Pro_M62" },
            "خناف شمو": { email: "kshamo@dar.ngo", dept: "البرامج", code: "Pro_X002" },
            "عبد الحميد الحسين": { email: "aALHUSSAIN@dar.ngo", dept: "البرامج", code: "Pro_A89" },
            "هند الفارس": { email: "hAlfares@dar.ngo", dept: "البرامج", code: "Pro_H55" },
            "آلان خليل": { email: "akhalil@dar.ngo", dept: "العمليات", code: "Op_A159" },
            "هبة المناديلي": { email: "hr@dar.ngo", dept: "العمليات", code: "Op_H753" },
            "عبد القادر سباغ": { email: "asabbagh@dar.ngo", dept: "العمليات", code: "Op_A654" },
            "لادي حامدي": { email: "lHamdi@dar.ngo", dept: "العمليات", code: "Op_L351" },
            "محمد بدور": { email: "mbaddou@dar.ngo", dept: "العمليات", code: "Op_M957" },
            "رشا دهنة": { email: "rdehneh@dar.ngo", dept: "العمليات", code: "Op_R684" },
            "إبراهيم شيخ نبي": { email: "inabi@dar.ngo", dept: "العمليات", code: "Op_IB132" },
            "مالك أومو": { email: "momo@dar.ngo", dept: "العمليات", code: "Op_M095" },
            "حازم الزير": { email: "Hmohammad@dar.ngo", dept: "الإعلام", code: "M_H268" },
            "فيلكس": { email: "fLegrand@dar.ngo", dept: "الشراكات", code: "Pa_F624" },
            "ريعان العاني": { email: "ralani@dar.ngo", dept: "الشراكات", code: "Pa_R978" },
            "عصمت بكر": { email: "eBaker@dar.ngo", dept: "الشراكات", code: "Pa_E990" },
            "سمر قطان": { email: "skattan@dar.ngo", dept: "الإدارة التنفيذية", code: "CEO_S111" }
        };

        let currentUser = null;

        // ============= جلب الرصيد من السيرفر =============
        async function loadBalance(employeeName) {
            const balanceDiv = document.getElementById('balanceSection');
            const grid = document.getElementById('balanceGrid');
            const loading = document.getElementById('balanceLoading');
            
            balanceDiv.style.display = 'block';
            loading.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تحميل الرصيد...';
            grid.innerHTML = '';
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getBalance&name=${encodeURIComponent(employeeName)}`);
                const result = await response.json();
                
                if (result.success && result.balance) {
                    const b = result.balance;
                    const types = [
                        { key: 'annual', label: 'سنوية', icon: 'fa-sun' },
                        { key: 'sick', label: 'مرضية', icon: 'fa-hospital' },
                        { key: 'bereavement', label: 'وفاة', icon: 'fa-heart' },
                        { key: 'hourly', label: 'ساعية', icon: 'fa-clock' },
                        { key: 'maternity', label: 'أمومة', icon: 'fa-baby' },
                        { key: 'paternity', label: 'أبوة', icon: 'fa-child' },
                        { key: 'unpaid', label: 'بلا راتب', icon: 'fa-money-bill' },
                        { key: 'hajj', label: 'حج', icon: 'fa-mosque' },
                        { key: 'marriage', label: 'زواج', icon: 'fa-heart' }
                    ];
                    
                    grid.innerHTML = '';
                    types.forEach(t => {
                        const value = b[t.key] || 0;
                        grid.innerHTML += `<div class="balance-item"><i class="fas ${t.icon}"></i><div class="label">${t.label}</div><div class="value">${value}</div><div class="unit">${t.key === 'hourly' ? 'ساعة' : 'يوم'}</div></div>`;
                    });
                    loading.innerHTML = '';
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                console.error('خطأ في جلب الرصيد:', error);
                loading.innerHTML = '<span style="color:#ff6b6b;">⚠️ خطأ في جلب الرصيد</span>';
            }
        }

        // ============= تسجيل الدخول =============
        window.verifySecurityCode = function() {
            const code = document.getElementById('securityCode').value.trim();
            for (const [name, data] of Object.entries(employees)) {
                if (data.code === code) {
                    currentUser = { name, ...data };
                    document.getElementById('dept').value = data.dept;
                    document.getElementById('empName').value = name;
                    document.getElementById('empEmail').value = data.email;
                    document.getElementById('leaveType').disabled = false;
                    document.getElementById('startDate').disabled = false;
                    document.getElementById('endDate').disabled = false;
                    document.getElementById('returnDate').disabled = false;
                    document.getElementById('reason').disabled = false;
                    document.getElementById('submitLeaveBtn').disabled = false;
                    document.getElementById('meetingTabBtn').classList.remove('disabled');
                    document.getElementById('securityError').style.display = 'none';
                    
                    // ✅ جلب الرصيد
                    loadBalance(name);
                    
                    // تعبئة قائمة الاجتماعات
                    const attendeeSelect = document.getElementById('meetingAttendee');
                    attendeeSelect.innerHTML = '<option value="">اختر الشخص</option>';
                    for (const [n] of Object.entries(employees)) {
                        if (n !== name) attendeeSelect.innerHTML += `<option value="${n}">${n}</option>`;
                    }
                    alert(`✅ مرحباً ${name}`);
                    return;
                }
            }
            document.getElementById('securityError').style.display = 'block';
        };

        function handleEnterKey(event) { if (event.key === 'Enter') verifySecurityCode(); }

        // ============= إرسال إجازة =============
        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const formData = {
                name: currentUser.name, email: currentUser.email, dept: currentUser.dept,
                type: document.getElementById('leaveType').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                returnDate: document.getElementById('returnDate').value,
                reason: document.getElementById('reason').value
            };
            document.getElementById('leaveLoader').style.display = 'block';
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(formData) });
            document.getElementById('leaveLoader').style.display = 'none';
            document.getElementById('leaveSuccess').innerHTML = '✅ تم إرسال الطلب!';
            document.getElementById('leaveSuccess').style.display = 'block';
            setTimeout(() => document.getElementById('leaveSuccess').style.display = 'none', 3000);
            loadBalance(currentUser.name); // تحديث الرصيد بعد الإرسال
        });

        // ============= حجز اجتماع =============
        document.getElementById('meetingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert('سجل الدخول أولاً');
            const meeting = {
                id: Date.now().toString(),
                title: document.getElementById('meetingTitle').value,
                attendee: document.getElementById('meetingAttendee').value,
                attendeeEmail: employees[document.getElementById('meetingAttendee').value]?.email,
                date: document.getElementById('meetingDate').value,
                time: document.getElementById('meetingTime').value,
                location: document.getElementById('meetingLocation').value,
                createdBy: currentUser.name
            };
            document.getElementById('meetingLoader').style.display = 'block';
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'createMeeting', meeting, organizer: currentUser }) });
            document.getElementById('meetingLoader').style.display = 'none';
            document.getElementById('meetingSuccess').innerHTML = '✅ تم حجز الاجتماع!';
            document.getElementById('meetingSuccess').style.display = 'block';
            setTimeout(() => document.getElementById('meetingSuccess').style.display = 'none', 3000);
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            if (tab === 'leave') {
                document.getElementById('leaveTabBtn').classList.add('active');
                document.getElementById('leaveTab').classList.add('active');
            } else {
                document.getElementById('meetingTabBtn').classList.add('active');
                document.getElementById('meetingTab').classList.add('active');
            }
        }

        function setupDates() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
            document.getElementById('returnDate').value = today;
            document.getElementById('meetingDate').value = today;
        }
        setupDates();
    </script>
</body>
</html>
